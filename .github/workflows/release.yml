name: Build and Release

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Source checks and unit tests
        run: npm run check
      - name: Linux application smoke test
        if: runner.os == 'Linux'
        run: PHW_SMOKE_TEST=1 xvfb-run -a npx electron . --no-sandbox
      - name: Build desktop packages
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: puzzle-hunt-workbench-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.blockmap
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: puzzle-hunt-workbench-*
          path: release-artifacts
          merge-multiple: true
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$TAG" release-artifacts/* \
            --target "$GITHUB_SHA" \
            --title "Puzzle Hunt Workbench $TAG" \
            --notes-file docs/RELEASE_NOTES.md
